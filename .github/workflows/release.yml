name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p speakdrill-cli -p speakdrill-gui

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/win32-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target/release/speakdrill.exe" $out
          Copy-Item "target/release/speakdrill-gui.exe" $out
          Copy-Item "scripts/kokoro_tts.py" $out
          Compress-Archive -Path "$out/*" -DestinationPath "speakdrill-${{ github.ref_name }}-win32-x64.zip"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: speakdrill-*.zip

  npm:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
