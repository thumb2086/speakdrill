name: release

on:
  push:
    tags: ["v*"]

# npm Trusted Publisher（OIDC）需要 id-token: write
permissions:
  contents: write     # 寫入 GitHub Release
  id-token: write     # npm 以 OIDC 自動發佈

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 核對 tag / Cargo.toml / package.json 版本一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v',''
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'Cargo.toml 找不到 [workspace.package].version' }
          $ws = $Matches[1]
          $pkg = Get-Content npm\package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $ws) { throw "npm/package.json ($($pkg.version)) 與 Cargo.toml ($ws) 不一致" }
          if ($tag -ne $ws) { throw "tag ($tag) 與 Cargo.toml / npm/package.json ($ws) 不一致；請先 bump 版本再打 tag" }
          Write-Output "Version OK: $ws"

  # ── 1. 在 Windows 上編譯（CLI + GUI），並上傳到 Releases ─────────────
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (CLI + GUI)
        run: cargo build --release -p speakdrill-cli -p speakdrill-gui

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/win32-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target/release/speakdrill.exe"     "$out/"
          Copy-Item "target/release/speakdrill-gui.exe" "$out/"
          Compress-Archive -Path "$out/*" `
            -DestinationPath "speakdrill-${{ github.ref_name }}-win32-x64.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: speakdrill-*.zip
          generate_release_notes: true

  # ── 2. 發佈 npm 套件（Trusted Publisher / OIDC，不需 token）─────────────
  npm:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@11

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Publish
        working-directory: npm
        run: npm publish --access public
        # 完全不用設 NODE_AUTH_TOKEN，npm 會自動走 OIDC