[workspace]
members = ["crates/myet-core", "crates/myet-cli", "crates/myet-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["myet-practice contributors"]
repository = "https://github.com/yourname/myet-practice"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
regex = "1"
hound = "3"
cpal = "0.15"
libloading = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
